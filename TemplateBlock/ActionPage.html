{% load static %}
<!DOCTYPE html>
<html lang="uk" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit - Панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'StyleCell/MainStyles.css' %}">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>
</head>
<body class="bg-main">
    <header class="navbar border-bottom px-4 py-2 sticky-top bg-body shadow-sm">
        <div class="d-flex align-items-center">
            <button class="btn btn-link p-0 me-3 text-body" id="menuBtn">
                <i class="bi bi-list fs-2"></i>
            </button>
            <a class="navbar-brand fs-3 fw-bold" href="{% url 'HP' %}">ORBIT</a>
        </div>
        <div class="ms-auto d-flex align-items-center">
            <a href="{% url 'LtP' %}" class="btn btn-danger btn-sm px-4 me-3 fw-bold rounded-pill">Вийти</a>
            <div id="themeBtn" style="cursor: pointer;" class="text-body p-2">
                <i class="bi bi-moon-stars-fill fs-4"></i>
            </div>
        </div>
    </header>

    <aside class="sidebar d-flex flex-column shadow" id="sidebar">
        <div class="p-4 border-bottom">
            <h4 class="mb-0 fw-bold">Альфа-версія</h4>
            <small class="text-secondary">v.0.2.65</small>
        </div>
        <nav class="nav nav-pills flex-column mt-3 flex-grow-1">
            <a href="{% url 'HP' %}" class="nav-link {% if request.resolver_match.url_name == 'HP' %}active{% endif %}">
                <i class="bi bi-grid me-2"></i> Головна
            </a>
            {% if member.group %}
            <a href="{% url 'GrP' %}" class="nav-link {% if active_tab == 'group' %}active{% endif %}">
                <i class="bi bi-person-video3 me-2"></i> Моя Група
            </a>
            {% endif %}
        </nav>
        <div class="p-4 border-top bg-light-subtle">
            <div class="d-flex align-items-center">
                <div class="bg-primary rounded-circle me-3 d-flex align-items-center justify-content-center text-white fw-bold" style="width: 40px; height: 40px;">
                    {{ user.username|slice:":1"|upper }}
                </div>
                <div class="fw-bold text-truncate">{{ user.username }}</div>
            </div>
        </div>
    </aside>

    <main class="content-wrapper" id="mainContent">
        <div class="container-fluid">
            {% block main_content %}{% endblock %}
        </div>
    </main>

    <script>
        const sidebar = document.getElementById('sidebar');
        const html = document.documentElement;
        const themeBtn = document.getElementById('themeBtn');
        const menuBtn = document.getElementById('menuBtn');

        const updateIcon = (theme) => {
            themeBtn.innerHTML = theme === 'dark' 
                ? '<i class="bi bi-sun-fill fs-4 text-warning"></i>' 
                : '<i class="bi bi-moon-stars-fill fs-4 text-primary"></i>';
        };
        updateIcon(html.getAttribute('data-bs-theme'));

        themeBtn.onclick = () => {
            const currentTheme = html.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateIcon(newTheme);
        };

        menuBtn.onclick = (e) => {
            e.stopPropagation();
            sidebar.classList.toggle('active');
        };
    </script>
</body>
</html>
