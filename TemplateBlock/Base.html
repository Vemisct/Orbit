{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Orbit - {% block title %}{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="{% static 'StyleCell/MainStyles.css' %}">
</head>
<body>
    <div class="d-flex">
        <aside class="sidebar d-flex flex-column">
            <div class="p-4 text-info fw-bold"><h2>DK</h2></div>
            <div class="py-2 border-top border-bottom px-4">Назва комірки</div>
            
            <nav class="nav nav-pills flex-column mb-auto mt-3">
                <a href="{% url 'HP' %}" class="nav-link {% if request.resolver_match.url_name == 'HP' %}active{% endif %}">
                    <i class="bi bi-grid me-2"></i> Головна
                </a>
                <a href="{% url 'EvP' %}" class="nav-link {% if request.resolver_match.url_name == 'EvP' %}active{% endif %}">
                    <i class="bi bi-calendar-event me-2"></i> Події
                </a>
                <a href="{% url 'AnP' %}" class="nav-link {% if request.resolver_match.url_name == 'AnP' %}active{% endif %}">
                    <i class="bi bi-megaphone me-2"></i> Оголошення
                </a>
                <a href="{% url 'GrP' %}" class="nav-link {% if request.resolver_match.url_name == 'GrP' %}active{% endif %}">
                    <i class="bi bi-person me-2"></i> Група
                </a>
            </nav>

            <div class="p-3 border-top mt-auto">
                <div class="px-3 mb-2 small text-muted">Усі інші комірки</div>
                <a href="#" class="nav-link"><i class="bi bi-gear me-2"></i> Налаштування</a>
            </div>
        </aside>

        <main class="flex-grow-1 p-5">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
