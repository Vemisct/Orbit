{% extends 'ActionPage.html' %}
{% block main_content %}
<div class="text-center mb-5">
    <h1 class="fw-bold">💎 Маркетплейс</h1>
    <p class="text-secondary">Підтримайте проект та отримайте круті фішки</p>
</div>

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="custom-card p-4 text-center border-primary border-3 h-100 shadow-sm">
            <div class="badge bg-primary rounded-pill px-3 py-2 mb-3">ПОПУЛЯРНЕ</div>
            <h3 class="fw-bold">Orbit Plus</h3>
            <div class="display-4 fw-bold my-3">99 <small class="fs-6 text-muted">грн/міс</small></div>
            
            <ul class="list-unstyled text-start my-4">
                <li class="mb-2"><i class="bi bi-check2-circle text-success me-2"></i> Унікальна рамка профілю</li>
                <li class="mb-2"><i class="bi bi-check2-circle text-success me-2"></i> Значок "Спонсор"</li>
                <li class="mb-2"><i class="bi bi-check2-circle text-success me-2"></i> Створення необмежених оголошень</li>
            </ul>

            <div id="google-pay-button-container" class="mt-4 d-flex justify-content-center" style="min-height: 45px;">
                <div id="gpay-loading" class="spinner-border text-primary spinner-border-sm" role="status"></div>
            </div>
            <p id="gpay-error" class="text-danger small mt-2 d-none">Google Pay недоступний у цьому браузері</p>
        </div>
    </div>
</div>

<script src="https://pay.google.com/gp/p/js/pay.js" onload="onGooglePayLoaded()"></script>
<script>
    const baseRequest = {
        apiVersion: 2,
        apiVersionMinor: 0
    };

    const allowedCardNetworks = ["MASTERCARD", "VISA"];
    const allowedCardAuthMethods = ["PAN_ONLY", "CRYPTOGRAM_3DS"];

    const baseCardPaymentMethod = {
        type: 'CARD',
        parameters: {
            allowedAuthMethods: allowedCardAuthMethods,
            allowedCardNetworks: allowedCardNetworks
        }
    };

    const cardPaymentMethod = Object.assign({
            tokenizationSpecification: {
                type: 'PAYMENT_GATEWAY',
                parameters: {
                    'gateway': 'example',
                    'gatewayMerchantId': 'exampleGatewayMerchantId'
                }
            }
        },
        baseCardPaymentMethod
    );

    let paymentsClient = null;

    function onGooglePayLoaded() {
        paymentsClient = new google.payments.api.PaymentsClient({
            environment: 'TEST' // Залиште TEST для розробки
        });

        const isReadyToPayRequest = Object.assign({}, baseRequest, {
            allowedPaymentMethods: [baseCardPaymentMethod]
        });

        paymentsClient.isReadyToPay(isReadyToPayRequest)
            .then(function(response) {
                document.getElementById('gpay-loading').classList.add('d-none');
                if (response.result) {
                    addGooglePayButton();
                } else {
                    document.getElementById('gpay-error').classList.remove('d-none');
                }
            })
            .catch(function(err) {
                console.error("GPay Error:", err);
                document.getElementById('gpay-loading').classList.add('d-none');
            });
    }

    function addGooglePayButton() {
        const button = paymentsClient.createButton({
            onClick: onPurchaseClicked,
            buttonColor: 'default',
            buttonType: 'buy' // 'buy' — найстабільніший тип
        });
        document.getElementById('google-pay-button-container').appendChild(button);
    }

    function onPurchaseClicked() {
        const paymentDataRequest = Object.assign({}, baseRequest, {
            allowedPaymentMethods: [cardPaymentMethod],
            transactionInfo: {
                totalPriceStatus: 'FINAL',
                totalPrice: '99.00',
                currencyCode: 'UAH',
                countryCode: 'UA'
            },
            merchantInfo: {
                merchantName: 'Orbit Project'
            }
        });

        paymentsClient.loadPaymentData(paymentDataRequest)
            .then(function(paymentData) {
                processPayment(paymentData);
            })
            .catch(function(err) {
                console.error("Payment failed", err);
            });
    }

    function processPayment(paymentData) {
        fetch('/payment-success/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({ 'result': 'success' })
        })
        .then(response => {
            if (response.ok) {
                alert('Premium активовано!');
                window.location.href = "{% url 'PrP' %}";
            }
        });
    }
</script>
{% endblock %}
