{% load static %}
<!DOCTYPE html>
<html lang="uk" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit - Панель</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'StyleCell/MainStyles.css' %}">
    <link rel="stylesheet" href="{% static 'StyleCell/NeonStyle.css' %}">
    <link rel="stylesheet" href="{% static 'StyleCell/ClumzyStyle.css' %}">

    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
            const savedStyle = localStorage.getItem('active-style');
            if (savedStyle) { document.documentElement.classList.add('style-' + savedStyle); }
        })();
    </script>
</head>
<body class="bg-main">
    <aside class="sidebar d-flex flex-column" id="sidebar">
        <div class="p-4 flex-grow-1">
            <h4 class="fw-bold mb-5 px-2 text-primary">ORBIT</h4>
            
            <nav class="nav flex-column gap-2">
                <a href="{% url 'HP' %}" class="nav-link {% if request.resolver_match.url_name == 'HP' %}active{% endif %}" title="Головна">
                    <i class="bi bi-house-door fs-5 me-2"></i> Головна
                </a>
                <a href="{% url 'PrP' %}" class="nav-link {% if request.resolver_match.url_name == 'PrP' %}active{% endif %}" title="Профіль">
                    <i class="bi bi-person fs-5 me-2"></i> Профіль
                </a>
                
                {% if user.member.group %}
                <div class="group-section-box">
                    <div class="px-3 mb-2">
                        <div class="group-label text-uppercase">Група</div>
                        <div class="text-secondary" style="font-size: 0.75rem;">Вкладки вашої групи</div>
                    </div>
                    
                    <a href="{% url 'GrMP' %}" class="nav-link {% if active_tab == 'group' %}active{% endif %}">
                        <i class="bi bi-people me-2"></i> Учасники
                    </a>
                    <a href="{% url 'forum:topic_list' %}" class="nav-link {% if active_tab == 'forum' %}active{% endif %}">
                        <i class="bi bi-chat-left-text"></i> Форум
                    </a>
                    <a href="{% url 'EvP' %}" class="nav-link {% if active_tab == 'events' %}active{% endif %}">
                        <i class="bi bi-calendar-event me-2"></i> Події
                    </a>
                    <a href="{% url 'AnP' %}" class="nav-link {% if active_tab == 'announcements' %}active{% endif %}">
                        <i class="bi bi-megaphone me-2"></i> Оголошення
                    </a>
                </div>
                {% endif %}
            </nav>
        </div>

        <div class="p-3 border-top d-flex justify-content-around align-items-center bg-body-tertiary">
            <a href="{% url 'ShP' %}" class="btn btn-link text-secondary position-relative hover-scale" title="Магазин">
                <i class="bi bi-cart3 fs-4"></i>
                {% if not user.member.is_premium %}
                <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
                {% endif %}
            </a>
            
            <a href="{% url 'StP' %}" class="btn btn-link text-secondary hover-scale" title="Налаштування">
                <i class="bi bi-gear fs-4"></i>
            </a>

            <div class="vr mx-2"></div>

            <a href="{% url 'LtP' %}" class="btn btn-link text-danger hover-scale" title="Вийти">
                <i class="bi bi-box-arrow-right fs-4"></i>
            </a>
        </div>
    </aside>

    <main class="content-wrapper" id="mainContent">
        <header class="d-lg-none d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom">
            <span class="fw-bold fs-4">ORBIT</span>
            <button class="btn btn-link text-body p-0" id="menuBtn">
                <i class="bi bi-list fs-1"></i>
            </button>
        </header>

        <div class="container-fluid px-0">
            {% block main_content %}{% endblock %}
        </div>
    </main>

    <script>
        const sidebar = document.getElementById('sidebar');
        const menuBtn = document.getElementById('menuBtn');
        
        if(menuBtn) {
            menuBtn.onclick = (e) => {
                e.stopPropagation();
                sidebar.classList.toggle('active');
            };
        }
        
        document.onclick = (e) => {
            if (window.innerWidth < 992 && !sidebar.contains(e.target) && menuBtn && !menuBtn.contains(e.target)) {
                sidebar.classList.remove('active');
            }
        };
    </script>
    <script>
    if (localStorage.getItem('street-style') === 'true') {
        document.getElementById('streetStyleLink').disabled = false;
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <style>
        .hover-scale { transition: transform 0.2s; }
        .hover-scale:hover { transform: scale(1.1); color: var(--bs-primary) !important; }
    </style>
</body>
</html>
