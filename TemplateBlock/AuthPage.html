{% load static %}
{% load socialaccount %} <!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Orbit - Вхід</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'StyleCell/MainStyles.css' %}">
</head>
<body class="bg-main">
    <div class="container auth-page-wrapper">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-5">
                    <h1 class="fw-bold display-4 text-primary">ORBIT</h1>
                    <p class="text-secondary">Єдина платформа для всього</p>
                </div>
                
                <div class="auth-card shadow-lg">
                    <h3 class="fw-bold mb-4 text-center">Ласкаво просимо</h3>
                    
                    {% if form.errors %}
                    <div class="alert alert-danger small rounded-3">
                        <i class="bi bi-exclamation-circle me-2"></i>Логін або пароль неправильні.
                    </div>
                    {% endif %}

                    <a href="{% provider_login_url 'google' %}" class="btn btn-light border w-100 py-2 mb-4 d-flex align-items-center justify-content-center gap-2 fw-bold position-relative overflow-hidden">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20" height="20">
                        Продовжити через Google
                    </a>

                    <div class="d-flex align-items-center mb-4">
                        <hr class="flex-grow-1">
                        <span class="px-2 text-secondary small">або</span>
                        <hr class="flex-grow-1">
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label small text-uppercase text-secondary fw-bold">Нікнейм</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small text-uppercase text-secondary fw-bold">Пароль</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow-sm">
                            Увійти
                        </button>
                    </form>
                    
                    <div class="mt-4 text-center">
                        <span class="text-secondary">Немає акаунту?</span>
                        <a href="{% url 'RgP' %}" class="text-primary fw-bold text-decoration-none">Зареєструватись</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
