{% extends 'ActionPage.html' %}
{% block main_content %}
<div class="container py-4">
    <h2 class="fw-bold mb-4">Налаштування інтерфейсу</h2>

    <div class="custom-card p-4 mb-4">
        <h5 class="mb-3">Стиль оформлення</h5>
        <div class="row g-3">
            <div class="col-md-4">
                <button onclick="setGlobalStyle('standard')" class="btn btn-outline-secondary w-100 py-3 h-100">
                    <i class="bi bi-circle mb-2 fs-3 d-block"></i>
                    Стандартний
                </button>
            </div>
            <div class="col-md-4">
                <button onclick="setGlobalStyle('neon')" class="btn btn-outline-primary w-100 py-3 h-100">
                    <i class="bi bi-lightning-charge-fill mb-2 fs-3 d-block"></i>
                    Neon (Анімація)
                </button>
            </div>
            <div class="col-md-4">
                <button onclick="setGlobalStyle('clumzy')" class="btn btn-outline-success w-100 py-3 h-100" style="border-color: #aed581; color: #aed581;">
                    <i class="bi bi-palette-fill mb-2 fs-3 d-block"></i>
                    Clumzy (Кольоровий)
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function setGlobalStyle(styleName) {
        document.documentElement.classList.remove('style-neon', 'style-clumzy');
        
        if (styleName === 'standard') {
            localStorage.removeItem('active-style');
        } else {
            document.documentElement.classList.add('style-' + styleName);
            localStorage.setItem('active-style', styleName);
        }
    }
</script>
{% endblock %}
