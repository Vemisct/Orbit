{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Orbit - Реєстрація</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'StyleCell/MainStyles.css' %}">
</head>
<body class="bg-main">
    <div class="container auth-page-wrapper">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-5">
                    <h1 class="fw-bold display-4">ORBIT</h1>
                    <p class="text-secondary">Приєднуйтесь до нашої спільноти</p>
                </div>
                
                <div class="auth-card shadow-lg">
                    <h3 class="fw-bold mb-4">Новий акаунт</h3>
                    
                    <form method="post">
                        {% csrf_token %}
                        {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label">{{ field.label }}</label>
                            {{ field }}
                            {% if field.help_text %}
                            <div class="form-text small opacity-50" style="font-size: 0.75rem;">{{ field.help_text }}</div>
                            {% endif %}
                            {% for error in field.errors %}
                            <div class="text-danger small mt-1">{{ error }}</div>
                            {% endfor %}
                        </div>
                        {% endfor %}
                        
                        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow mt-3">
                            Зареєструватися
                        </button>
                    </form>
                    
                    <div class="mt-4 text-center">
                        <span class="text-secondary">Вже є профіль?</span>
                        <a href="{% url 'LnP' %}" class="text-primary fw-bold text-decoration-none">Увійти</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
