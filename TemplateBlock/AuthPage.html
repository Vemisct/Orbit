{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Orbit - Вхід</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'StyleCell/MainStyles.css' %}">
</head>
<body class="bg-main">
    <div class="container auth-page-wrapper">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-5">
                    <h1 class="fw-bold display-4">ORBIT</h1>
                    <p class="text-secondary">Увійдіть, щоб продовжити роботу</p>
                </div>
                
                <div class="auth-card shadow-lg">
                    <h3 class="fw-bold mb-4">Авторизація</h3>
                    
                    {% if form.errors %}
                    <div class="alert alert-danger small">
                        Логін або пароль введено неправильно. Спробуйте ще раз.
                    </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Нікнейм (Логін)</label>
                            <input type="text" name="username" class="form-control" placeholder="Введіть ваш нікнейм" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Пароль</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow">
                            Увійти в систему
                        </button>
                    </form>
                    
                    <div class="mt-4 text-center">
                        <span class="text-secondary">Ще не маєте акаунту?</span>
                        <a href="{% url 'RgP' %}" class="text-primary fw-bold text-decoration-none">Створити зараз</a>
                    </div>
                </div>
                
                <div class="text-center mt-4">
                    <a href="{% url 'WlP' %}" class="text-secondary small">← Повернутися на головну</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
