{% load static %}
<!DOCTYPE html>
<html lang="uk" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBIT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'StyleCell/MainStyles.css' %}">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>
</head>
<body>
    <header class="navbar border-bottom px-4 py-3 bg-body shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold fs-3" href="{% url 'WlP' %}">ORBIT</a>
            <div id="themeBtn" style="cursor: pointer;" class="text-body p-2">
                <i class="bi bi-moon-stars-fill fs-4"></i>
            </div>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script>
        const html = document.documentElement;
        const themeBtn = document.getElementById('themeBtn');
        const updateIcon = (theme) => {
            themeBtn.innerHTML = theme === 'dark' 
                ? '<i class="bi bi-sun-fill fs-4 text-warning"></i>' 
                : '<i class="bi bi-moon-stars-fill fs-4 text-primary"></i>';
        };
        updateIcon(html.getAttribute('data-bs-theme'));
        themeBtn.onclick = () => {
            const currentTheme = html.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateIcon(newTheme);
        };
    </script>
</body>
</html>
